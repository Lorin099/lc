<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prontuário Eletronico - Estrutura</title>
    <!--bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" >
    </head>
    <body>

        <!--Navbar-->
        <nav class="navbar navbar-dark bg-primary">
            <div class="container-fluid justify-content-center">
                <span class="navbar-brand mb-0 h1">Prontuário Eletrônico</span>
            </div>
        </nav>

        <div class="container mt-4">
            <form class="formulario" >
        <!-- Dados do Paciente-->
<div class="card mb-4 shadow-sm rounded-4">
<div class="card-header bg-primary text-white text-center fw-bold">
<i class="bi bi-person"></i> Dados do Paciente
</div>
                <div class="card-body">
                <div class="row">

                <div class="col-md-6 mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" required>
                </div>

                <div class="col-md-3 mb-3">
                <label class="form-label">Idade</label>
                <input type="number" class="form-control" id="idade">
                </div>

                <div class="col-md-3 mb-3">
             <label class="form-label">Sexo</label>
             <select class="form-control" id="sexo">
                <option>Masculino</option>
                <option>Feminino</option>
            </select>
        </div>

    </div>
</div>
                </div>
                <!--Sinais Vitais-->
                <div class="card mb-4 shadow-sm rounded-4">
<div class="card-header bg-danger text-white text-center fw-bold">
<i class="bi bi-heart-pulse"></i> Sinais Vitais
</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3 mb-3">
    <label class="form-label">Pressão Arterial</label>
    <input type="text" class="form-control" id="pressao" placeholder="120/80">
</div>

<div class="col-md-3 mb-3">
    <label class="form-label">Frequência Cardíaca</label>
    <input type="number" class="form-control" id="fc" placeholder="bpm">
</div>

<div class="col-md-3 mb-3">
    <label class="form-label">Temperatura</label>
    <input type="number" step="0.1" class="form-control" id="temperatura" placeholder="°C">
</div>

<div class="col-md-3 mb-3">
    <label class="form-label">Saturação de O2</label>
    <input type="number" class="form-control" id="spo2" placeholder="%">
</div>
                        </div>
                     </div>
                </div>
                <!--Evolução-->
                <div class="card mb-4 shadow-sm rounded-4">
<div class="card-header bg-warning text-dark text-center fw-bold">
<i class="bi bi-journal-text"></i> Evolução do Paciente
</div>
                    <div class="mb-3">
    <label class="form-label">Evolução / Observações</label>
    <textarea class="form-control" id="evolucao" rows="4"></textarea>
</div>
                </div>
                <!--Medicação-->
                <div class="card mb-4 shadow-sm rounded-4">
<div class="card-header bg-success text-white text-center fw-bold">
<i class="bi bi-capsule"></i> Medicação
</div>
                    <div class="card-body">
                        <div class="row">

    <div class="col-md-6 mb-3">
        <label class="form-label">Medicamento</label>
        <input type="text" class="form-control" id="medicamento">
    </div>

    <div class="col-md-3 mb-3">
        <label class="form-label">Dosagem</label>
        <input type="text" class="form-control" id="dosagem" placeholder="500mg">
    </div>

    <div class="col-md-3 mb-3">
        <label class="form-label">Frequência</label>
        <input type="text" class="form-control" id="frequencia" placeholder="2x ao dia">
    </div>

    <div class="col-md-3 mb-3">
        <label class="form-label">Horário</label>
        <input type="time" class="form-control" id="horario" placeholder="2x ao dia">
    </div>

</div>
                    </div>
                </div>
                <!--Botão-->
                <div class="text-end mb-5">
<button class="btn btn-success btn-lg shadow">
<i class="bi bi-save"></i> Salvar Prontuário
</button>
</div>
            </form>
            <!-- Caixa de Resultado -->
<div id="resultado" class="card shadow d-none">
<div class="card-header bg-dark text-white">
Resultado do Prontuário
</div>
<div class="card-body"></div>
</div>
</div>

<!-- Mensagem de sucesso -->
<div class="toast position-fixed bottom-0 end-0 p-3" id="toastSucesso">
<div class="toast-header">
<strong class="me-auto">Sistema</strong>
<button type="button" class="btn-close" data-bs-dismiss="toast"></button>
</div>
<div class="toast-body">
Prontuário salvo com sucesso!
</div>
</div>
        <script>
document.querySelector(".formulario").addEventListener("submit", function(e) {
    e.preventDefault();

    const prontuario = {
        nome: document.getElementById("nome").value,
        idade: document.getElementById("idade").value,
        sexo: document.getElementById("sexo").value,

        sinaisVitais: {
            pressao: document.getElementById("pressao").value,
            fc: document.getElementById("fc").value,
            temperatura: document.getElementById("temperatura").value,
            spo2: document.getElementById("spo2").value
        },

        evolucao: document.getElementById("evolucao").value,

        medicacao: {
            medicamento: document.getElementById("medicamento").value,
            dosagem: document.getElementById("dosagem").value,
            frequencia: document.getElementById("frequencia").value,
            horario: document.getElementById("horario").value
        }
    };

    document.querySelector(".formulario").addEventListener("submit", function(e)

 let resultado =
<ul class="list-group">
<li class="list-group-item"><strong>Nome:</strong> ${nome}</li>
<li class="list-group-item"><strong>Idade:</strong> ${idade)}</li>
<li class="list-group-item"><strong>Sexo:</strong> ${sexo}</li>
<li class="list-group-item"><strong>Pressão:</strong> ${pressao}</li>
<li class="list-group-item"><strong>Temperatura:</strong> ${temperatura}</li>
<li class="list-group-item"><strong>Frequência:</strong> ${frequencia}</li>
<li class="list-group-item"><strong>Saturação:</strong> ${saturacao}</li>
<li class="list-group-item"><strong>Evolução:</strong> ${evolucao}</li>
<li class="list-group-item"><strong>Medicamento:</strong> ${medicamento}</li>
<li class="list-group-item"><strong>Dosagem:</strong> ${dosagem}</li>
<li class="list-group-item"><strong>Horário:</strong> ${horario}</li>
</ul>
let caixa document.getElementById("resultado");
caixa.querySelector(".card-body").innerHTML = resultado;
caixa.classList.remove("d-none");
let toast = new bootstrap. Toast (document.getElementById('toastSucesso'));
toast.show();

let mensagem = document.getElementById("mensagem");
mensagem.classList.remove("d-none");
caixa.innerHTML = resultado;
caixa.classList.remove("d-none");

let mensagem = document.getElementById("mensagem");
mensagem.classList.remove("d-none");

caixa.scrollIntoView({ behavior: "smooth" });

let caixa = document.getElementById("resultado");
caixa.innerHTML = resultado;
caixa.classList.remove("d-none");

// rolar a tela até o resultado
caixa.scrollIntoView({ behavior: "smooth" });
</script>

    </body>
